<script>
const $=s=>document.querySelector(s),app=$('#app'),sh=a=>[...a].sort(()=>Math.random()-.5),rnd=n=>Math.floor(Math.random()*n);
const C=[["la carte mère","relier tous les composants et les faire communiquer","le format et le nombre d'emplacements","le plan de la ville : toutes les routes y passent"],["le processeur","effectuer les calculs et traiter les informations","la fréquence (GHz) et le nombre de cœurs","le cerveau"],["la mémoire vive (RAM)","mémoriser temporairement les informations en cours d'utilisation","la capacité (Go)","le bureau de travail : rapide, mais il se vide quand on éteint"],["le disque dur (ou SSD)","stocker les données de façon permanente","la capacité (Go ou To)","l'armoire : on range, ça reste même éteint"],["l'alimentation","fournir l'énergie électrique à tous les composants","la puissance (W)","la prise de courant qui nourrit tout"],["la carte graphique","traiter les images et gérer l'affichage","la mémoire vidéo (Go)","le peintre qui dessine l'image"],["la carte son","traiter les sons","le nombre de canaux audio (5.1, 7.1)","le musicien"],["la carte réseau","connecter l'ordinateur au réseau","le débit (Mbit/s)","le facteur qui relie à Internet"],["le ventilateur","refroidir les composants","la vitesse de rotation (tr/min)","la climatisation"],["le boîtier","protéger et regrouper les composants","les dimensions et le format","la maison qui protège tout"]];

const UN=[["la fréquence d'un processeur","GHz (gigahertz)"],["la capacité de la RAM","Go (gigaoctets)"],["la puissance d'une alimentation","W (watts)"],["la taille d'un écran","pouces"],["la résolution d'un écran","pixels"],["le débit d'un réseau","Mbit/s"],["la vitesse d'une imprimante","pages par minute (ppm)"],["la sensibilité d'une souris","dpi"]];

const FC=[["Stocker les données","fonction d'usage"],["Capacité : 512 Go","caractéristique"],["Effectuer les calculs","fonction d'usage"],["Fréquence : 3,5 GHz","caractéristique"],["Puissance : 500 W","caractéristique"],["Refroidir le processeur","fonction d'usage"],["Fournir l'énergie électrique","fonction d'usage"],["Résolution : 1920 × 1080 pixels","caractéristique"],["Imprimer des documents","fonction d'usage"],["Taille : 24 pouces","caractéristique"]];
const fcQs=n=>sh(FC).slice(0,n).map(x=>{const e=x[1]=="caractéristique"?"C'est une valeur qu'on peut mesurer, avec une unité : c'est une caractéristique.":"C'est à quoi ça sert, avec un verbe d'action : c'est une fonction d'usage.";return[`« ${x[0]} » est…`,x[1],[x[1]=="caractéristique"?"fonction d'usage":"caractéristique","un composant","un périphérique"].slice(0,2),e,e]});
const P=[["le clavier",0,"saisir du texte"],["la souris",0,"déplacer le pointeur et sélectionner"],["la webcam",0,"filmer et capter des images"],["le microphone",0,"capter le son"],["le scanner",0,"numériser un document"],["la manette de jeu",0,"commander un jeu"],["l'écran",1,"afficher les images"],["l'imprimante",1,"imprimer sur papier"],["les haut-parleurs",1,"restituer le son"],["le vidéoprojecteur",1,"projeter l'image sur un mur"],["la clé USB",2,"stocker et transporter des données"],["le disque dur externe",2,"sauvegarder des données"],["l'écran tactile",2,"afficher et recevoir les touchers"],["le casque avec micro",2,"écouter et parler"]];
const TY=["périphérique d'entrée","périphérique de sortie","périphérique d'entrée et de sortie"],FL=["Périphérique ➜ unité centrale","Unité centrale ➜ périphérique","Unité centrale ⇄ périphérique (deux sens)"],EX=["envoie des informations à l'unité centrale : c'est une entrée.","reçoit des informations de l'unité centrale : c'est une sortie.","échange des informations dans les deux sens : entrée et sortie."];

const flQs=n=>sh(P).slice(0,n).map(x=>{const e=`${x[0]} ${EX[x[1]]}`;return[`Quel est le sens des informations pour « ${x[0]} » ?`,FL[x[1]],FL.filter((_,j)=>j!=x[1]),e,e]});
const pfQs=n=>sh(P).slice(0,n).map(x=>{const e=`${x[0]} sert à ${x[2]}.`;return[`À quoi sert « ${x[0]} » ?`,x[2],sh(P.filter(y=>y!==x)).slice(0,3).map(y=>y[2]),e,e]});
const SIT=[["Ton ordinateur ralentit quand tu ouvres beaucoup de programmes en même temps. Que faut-il augmenter ?","la mémoire vive (RAM)",["le disque dur externe","la carte son","le clavier"],"Plus de RAM = un plus grand bureau de travail."],["Tu n'as plus de place pour tes photos et vidéos. Que faut-il augmenter ?","la capacité du disque dur (ou SSD)",["la mémoire vive (RAM)","la puissance de l'alimentation","la fréquence du processeur"],"Le stockage permanent, c'est le disque dur."],["Les images d'un jeu vidéo sont saccadées. Quel composant est en cause ?","la carte graphique",["la carte son","la carte réseau","le boîtier"],"La carte graphique traite les images."],["Tu n'entends aucun son. Quel composant (ou périphérique) faut-il vérifier ?","la carte son et les haut-parleurs",["la carte graphique","le scanner","la RAM"],"Le son : carte son et haut-parleurs."],["L'ordinateur surchauffe et s'éteint tout seul. Que faut-il vérifier ?","le ventilateur (refroidissement)",["la carte son","le clavier","le disque dur externe"],"Le ventilateur refroidit les composants."],["L'ordinateur ne s'allume plus alors que la prise de courant fonctionne. Quel composant est suspect ?","l'alimentation",["la carte graphique","la souris","la carte réseau"],"L'alimentation fournit l'énergie à tous les composants."],["Tu veux te connecter à Internet par un câble. Quel composant est utilisé ?","la carte réseau",["la carte son","le processeur","l'imprimante"],"La carte réseau connecte au réseau."],["Tu veux numériser un devoir papier. Quel périphérique choisis-tu ?","le scanner (entrée)",["l'imprimante (sortie)","les haut-parleurs (sortie)","le vidéoprojecteur (sortie)"],"Le scanner envoie une image à l'ordinateur : c'est une entrée."],["Tu veux projeter la leçon devant la classe. Quel périphérique choisis-tu ?","le vidéoprojecteur (sortie)",["le scanner (entrée)","la webcam (entrée)","le microphone (entrée)"],"Il reçoit l'image de l'ordinateur : c'est une sortie."],["Quel composant calcule et « réfléchit » comme un cerveau ?","le processeur",["la carte mère","l'alimentation","le boîtier"],"Le processeur effectue les calculs."]];

const ST=[["Combien de bits y a-t-il dans 1 octet ?","8",["4","10","16"],"1 octet = 8 bits."],["Quelle unité est la plus grande ?","le téraoctet (To)",["le mégaoctet (Mo)","le kilooctet (Ko)","le gigaoctet (Go)"],"Ko < Mo < Go < To : on multiplie par 1000 à chaque fois."],["La RAM est une mémoire…","temporaire : elle s'efface quand on éteint",["permanente","réservée à Internet","qui ne sert à rien"],"RAM = mémoire de travail temporaire."],["Le disque dur garde les données…","même quand l'ordinateur est éteint",["seulement quand il est allumé","seulement pendant 1 heure","seulement si on le refroidit"],"Disque dur = stockage permanent."]];
const sQs=n=>sh(ST).slice(0,n).map(x=>[...x,x[3]]);
const tb=(h,r)=>`<div class="sx"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(y=>`<tr>${y.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`;
const LV=[
{n:"Ceinture blanche",e:"🧩",b:"#f3f3f3",t:"Les constituants et leurs fonctions",gen:()=>[...cQs(8),...sQs(2)],ls:`<h2>📜 Parchemin 1 : l'unité centrale</h2><p>L'unité centrale est le boîtier qui contient tous les composants. Touche une ligne pour l'écouter.</p>${tb(["Composant","Fonction d'usage","Pour retenir"],C.map(x=>[x[0],x[1],x[3]]))}<div class="key">⚠️ Ne confonds pas <b>RAM</b> (temporaire, rapide) et <b>disque dur</b> (permanent, plus lent).<br>Une <b>fonction d'usage</b> = à quoi ça sert.</div>`},
{n:"Ceinture jaune",e:"📏",b:"#f2c400",t:"Fonction d'usage ou caractéristique ?",gen:()=>[...chQs(4),...unQs(3),...fcQs(3)],ls:`<h2>📜 Parchemin 2 : les caractéristiques</h2>${tb(["Composant","Caractéristique à regarder"],C.map(x=>[x[0],x[2]]))}${tb(["Grandeur","Unité"],UN)}<div class="key"><b>Fonction d'usage</b> = à quoi ça sert (un verbe : stocker, calculer, refroidir…).<br><b>Caractéristique</b> = ce qu'on mesure (une valeur + une unité : 16 Go, 3,5 GHz, 500 W).<br>1 octet = 8 bits · Ko → Mo → Go → To : ×1000 à chaque fois.</div>`},
{n:"Ceinture verte",e:"🔌",b:"#2f9e44",t:"Les périphériques et le sens des flux",gen:()=>[...pQs(4),...flQs(3),...pfQs(3)],ls:`<h2>📜 Parchemin 3 : les périphériques</h2>${tb(["Périphérique","Type","Sens des informations"],P.map(x=>[x[0],TY[x[1]],FL[x[1]]]))}<div class="key">🟢 <b>Entrée</b> : j'envoie des informations <i>à</i> l'ordinateur (clavier, souris…).<br>🔵 <b>Sortie</b> : l'ordinateur me <i>restitue</i> des informations (écran, imprimante…).<br>🟣 <b>Entrée et sortie</b> : les deux (clé USB, écran tactile…).<br>Astuce : regarde la flèche. Vers l'unité centrale = entrée. Depuis l'unité centrale = sortie.</div>`},
{n:"Ceinture noire",e:"🛠️",b:"#1a1a2e",t:"Résoudre des problèmes",gen:()=>[...stQs(8),...sQs(2)],ls:`<h2>📜 Parchemin 4 : le technicien</h2>${tb(["Composant","Symptôme typique"],[["la mémoire vive (RAM)","l'ordinateur ralentit avec beaucoup de programmes"],["le disque dur (ou SSD)","plus de place pour les fichiers"],["la carte graphique","images saccadées, jeux qui rament"],["l'alimentation","l'ordinateur ne s'allume pas"],["le ventilateur","surchauffe, extinction toute seule"],["la carte réseau","pas de connexion à Internet"],["la carte son","pas de son"]])}<div class="key">Méthode : 1) quel est le <b>symptôme</b> ? 2) quelle est la <b>fonction</b> du composant concerné ? 3) quelle <b>caractéristique</b> faut-il améliorer ?</div>`},

const setSt=()=>$("#st").textContent="🔥 "+S.streak;
function home(){let h=`<section class="card hero"><div style="font-size:3rem">🖥️⚙️</div><h1>Deviens un expert de l'ordinateur</h1><p>4 ceintures et le <b>mode examen</b> pour l'évaluation sur les constituants de l'unité centrale et les périphériques. Vise le sans-faute !</p>${S.best!==null?`<p class="big">${fmt(S.best)}<small style="font-size:1.1rem"> / 20</small></p><p>Meilleure note à l'examen blanc</p>`:""}</section><div class="map">`;
LV.forEach((L,i)=>{h+=`<button class="lv" style="--b:${L.b}" onclick="start(${i})"><span style="font-size:1.7rem">${L.e}</span><span><b>${L.n}</b><small>${L.t}</small></span><span class="s">${S.ok[i]!=null?(i==4?fmt(S.ok[i])+"/20":"⭐ "+S.ok[i]+"/"+S.n[i]):"À faire"}</span></button>`});
app.innerHTML=h+"</div>";scrollTo(0,0)}
S.n={};
function start(i){S.li=i;qs=LV[i].gen().map((q,k)=>({q,k,f:0}));S.queue=qs.map(x=>x);S.done=0;S.first=0;S.tot=qs.length;S.n[i]=qs.length;const L=LV[i];
if(!L.ls)return show();app.innerHTML=`<section class="card ls" style="border-top:12px solid ${L.b}">${L.ls}${/<table/.test(L.ls)?`<p class="c">🔊 Touche un ligne du tableau pour l'entendre !</p>`:""}<div class="btns"><button class="btn g" onclick="home()">⬅ Carte</button><button class="btn" onclick="show()">J'ai compris : au combat ! ⚔️</button></div></section>`;scrollTo(0,0)}
function show(){stop();if(!S.queue.length)return end();const L=LV[S.li],c=S.queue[0],q=c.q;S.cur=c;S.ans=false;S.o=sh([{t:q[1],c:1},...q[2].map(t=>({t,c:0}))]);const pct=Math.round(S.done/S.tot*100);
app.innerHTML=`${L.ls?`<details><summary>📜 Revoir le parchemin</summary><div class="ls">${L.ls}</div></details>`:""}<div class="qh"><span>${L.e} ${L.n}</span><span>${S.done} / ${S.tot}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="card">${c.f?'<span class="tag">🔁 Rattrapage</span>':""}<p class="q">${q[0]}</p><button class="sp" onclick="spk(S.cur.q[0],'la')">🔊 Lire la question</button><div class="opts">${S.o.map((o,i)=>`<button class="opt" onclick="pick(${i})"><span class="k">${"ABCD"[i]}</span><span>${o.t}</span></button>`).join("")}</div><div id="fb"></div></div>`;scrollTo(0,0)}
function pick(i){if(S.ans)return;S.ans=true;const c=S.cur,o=S.o[i],b=[...document.querySelectorAll(".opt")];b.forEach(x=>x.disabled=true);let fb;
if(o.c){b[i].classList.add("good");S.queue.shift();S.done++;if(!c.f)S.first++;S.streak++;cheer("g");fb=`<div class="fb good"><b>✅ ${S.msg}${S.streak>=3?" 🔥 x"+S.streak:""}</b>${c.q[3]}</div>`}
else{b[i].classList.add("bad");b[S.o.findIndex(x=>x.c)].classList.add("good");c.f=1;S.queue.shift();S.queue.push(c);S.streak=0;cheer("b");fb=`<div class="fb bad"><b>💪 ${S.msg}</b>Bonne réponse : <b>${c.q[1]}</b><br>${c.q[3]}<br><em>Elle reviendra à la fin pour que tu la maîtrises.</em></div>`}
setSt();sfx(o.c);if(c.q[4])spk(c.q[4],"la");spk(S.msg,"fr");$("#fb").innerHTML=fb+`<div class="btns"><button class="btn" id="nx" onclick="show()">Suivant ➜</button></div>`;$("#nx").focus({preventScroll:true});$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function end(){const L=LV[S.li],ex=S.li==4,g=S.first/S.tot*20;S.ok[S.li]=ex?g:S.first;if(ex&&(S.best===null||g>S.best))S.best=g;
const perfect=S.first==S.tot,m=cheer(perfect?"p":S.first/S.tot>=.8?"h":"l");
app.innerHTML=`<section class="card c"><div style="font-size:3rem">${perfect?"🏆":"🥷"}</div><h2>${ex?"Examen blanc terminé":L.n+" validée !"}</h2><p class="big">${ex?fmt(g)+" / 20":S.first+" / "+S.tot}</p><p>bonnes réponses du premier coup.</p><p><b>${m}</b></p><div class="btns"><button class="btn g" onclick="start(${S.li})">🔁 Rejouer</button>${S.li<4?`<button class="btn" onclick="start(${S.li+1})">Suivant ➜</button>`:""}<button class="btn g" onclick="home()">🗺️ Carte</button></div></section>`;scrollTo(0,0);sfx(1);spk(m,"fr")}
home();
</script></body></html>
